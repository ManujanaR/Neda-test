<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEC Self-Rating Questionnaire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-6 font-sans">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded shadow">
        <h1 class="text-2xl font-bold mb-4">Self-Rating Questionnaire</h1>
        <p class="mb-6 text-sm text-gray-600">Rate yourself: 5 (Always/At all), 4 (Mostly), 3 (Moderately), 2 (Rarely), 1 (Never)</p>
        
        <form id="pecForm">
            <div id="questionsContainer" class="space-y-4 mb-8"></div>
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">Calculate Results</button>
        </form>

        <div id="results" class="hidden mt-10">
            <h2 class="text-xl font-bold mb-4">Your Entrepreneurial Competency Profile</h2>
            <div class="max-w-lg mx-auto">
                <canvas id="radarChart"></canvas>
            </div>
            <div id="scoreTable" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-2 text-sm"></div>
        </div>
    </div>

    <script>
        const questions = [
            "I look for things that need to be done",
            "When faced with a difficult problem, I spend a lot of time trying to find a solution",
            "I complete my work on time",
            "It bothers me when things are not done very well.",
            "I prefer situations in which I can control the outcomes as much as possible",
            "When starting a new task or project, I gather a great deal of information before going ahead",
            "I get others to support my recommendations",
            "I feel confident that I will succeed at whatever I try to do",
            "No matter whom I'm talking to, I'm a good listener",
            "I do things that need to be done before being asked to do so by others",
            "I try several times to get people to do what I would like them to do",
            "I keep the promise I make",
            "My own work is better than that of other people I work with",
            "I don't try something new without making sure I will succeed",
            "I seek the advice of people who know a lot about the tasks I'm working on",
            "I do not spend much time thinking about how to influence others",
            "I change my mind if others disagree strongly with me",
            "I feel resentful when I don't get my way",
            "I like challenges and new opportunities",
            "When something gets in the way of what I'm trying to do, I keep on trying to accomplish what I want",
            "I am happy to do someone else's work if necessary to get the job done on time",
            "It bothers me when my time is wasted",
            "I weigh my chances of succeeding or failing before I decide to do something",
            "I take action without wasting time gathering information.",
            "I get important people to help me accomplish my goals",
            "When trying something difficult or challenging, I feel confident that I will succeed",
            "In the past I have had failures",
            "I prefer activities that I know well and with which I am comfortable",
            "When faced with major difficulties, I quickly go on to other things",
            "When I'm doing a job for someone, I make a special effort to make sure that the person is happy with my work.",
            "I'm never entirely happy with the way in which things are done; I always think there must be a better way",
            "I do things that are risky",
            "When working for a project for someone, I ask many questions to be sure I understand what the person wants.",
            "In order to reach my goals, I think of solutions that benefit everyone involved in the problem.",
            "I do very good work",
            "There have been occasions when I took advantage of someone",
            "I try things that are very new and different from what I have done before",
            "I try several ways to overcome things that get in the way of reaching my goals",
            "My family and personal life are more important to me than work deadlines I set for myself",
            "I do not find ways to complete tasks faster at work and at home",
            "I do things that others consider risky",
            "I go to several different sources to get information to help with tasks or projects",
            "I am able to get people who have strong opinions or ideas to change their minds",
            "I stick with my decisions even if others disagree strongly with me",
            "When I don't know something, I don't mind admitting it"
        ];

        const labels = [
            "A: Seeking Opportunities", "B: Persistence", "C: Commitment to work",
            "D: Quality & Creativity", "E: Risk taking", "F: Goal setting",
            "G: Persuasion & Networking", "H: Self-confidence"
        ];

        const container = document.getElementById('questionsContainer');
        questions.forEach((q, i) => {
            const html = `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b pb-2">
                    <span class="mb-2 sm:mb-0 sm:w-2/3">${i + 1}. ${q}</span>
                    <div class="flex space-x-4 sm:w-1/3 justify-end">
                        ${[1, 2, 3, 4, 5].map(val => `
                            <label class="flex flex-col items-center cursor-pointer">
                                <span class="text-xs text-gray-500">${val}</span>
                                <input type="radio" name="q${i + 1}" value="${val}" required class="mt-1 w-4 h-4 text-blue-600">
                            </label>
                        `).join('')}
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        });

        let chartInstance = null;

        document.getElementById('pecForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const getVal = (n) => parseInt(document.querySelector(`input[name="q${n}"]:checked`).value);
            
            // Correction factor
            const cfScore = -getVal(9) - getVal(18) - getVal(27) + getVal(36) + getVal(45) + 18;
            let deduction = cfScore >= 24 ? 7 : cfScore >= 22 ? 5 : cfScore >= 20 ? 3 : 0;

            const scores = [
                getVal(1) + getVal(10) + getVal(19) - getVal(28) + getVal(37) + 6 - deduction,
                getVal(2) + getVal(11) + getVal(20) - getVal(29) + getVal(38) + 6 - deduction,
                getVal(3) + getVal(12) + getVal(21) + getVal(30) - getVal(39) + 6 - deduction,
                getVal(4) + getVal(13) + getVal(22) + getVal(31) - getVal(40) + 6 - deduction,
                -getVal(5) + getVal(14) + getVal(23) + getVal(32) + getVal(41) + 6 - deduction,
                -getVal(6) + getVal(15) + getVal(24) + getVal(33) + getVal(42) + 6 - deduction,
                -getVal(7) + getVal(16) + getVal(25) + getVal(34) + getVal(43) + 6 - deduction,
                -getVal(8) + getVal(17) + getVal(26) + getVal(35) + getVal(44) + 6 - deduction,
            ];

            document.getElementById('results').classList.remove('hidden');
            
            const tableHTML = labels.map((l, i) => `
                <div class="border-b py-2 flex justify-between">
                    <span class="text-gray-700">${l}</span>
                    <span class="font-bold">${scores[i]}</span>
                </div>
            `).join('');
            document.getElementById('scoreTable').innerHTML = tableHTML;

            const ctx = document.getElementById('radarChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'],
                    datasets: [{
                        label: 'Competency Score',
                        data: scores,
                        backgroundColor: 'rgba(59, 130, 246, 0.2)',
                        borderColor: 'rgba(59, 130, 246, 1)',
                        pointBackgroundColor: 'rgba(59, 130, 246, 1)',
                        pointBorderColor: '#fff',
                        pointHoverBackgroundColor: '#fff',
                        pointHoverBorderColor: 'rgba(59, 130, 246, 1)'
                    }]
                },
                options: { 
                    scales: { 
                        r: { 
                            min: 0, 
                            max: 25,
                            ticks: { stepSize: 5 }
                        } 
                    } 
                }
            });
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        });
    </script>
</body>
</html>
